server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed Vite assets are immutable. The hash is exactly eight characters,
  # so a public asset whose name merely contains a dash (e.g.
  # "city-captured-classic.mp3") is not mistaken for a hashed file.
  # The pattern is quoted because nginx reads `{` as the start of a block.
  location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2?|ttf|otf|eot|map)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The game artwork under /assets is served from the public directory and is
  # *not* hashed, so it must not be cached for a year — otherwise a new tile
  # would never reach an installed PWA.
  location /assets/ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # The service worker must never be cached: the browser has to see the new
  # one on every deploy, or the app is stuck on an old build forever.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    default_type application/javascript;
    try_files $uri =404;
  }

  # The web app manifest is small and may be cached briefly.
  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=3600" always;
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # The document itself must be revalidated so a deploy is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # SPA fallback for client-side routes / refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
