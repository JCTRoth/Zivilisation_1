name: Playwright Tests

on:
  push:
    branches: [main, master]
  # Run on every pull request, regardless of target branch.
  pull_request:

# Cancel superseded runs when a new commit lands on the same PR/branch.
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      # *.svg / image assets are Git-LFS-tracked (see .gitattributes). Without
      # `lfs: true` the checkout leaves pointer files behind, so tests that read
      # the real artwork fail ("trireme.svg should be SVG: expected 'version
      # https://git-lfs.github.com/spec/v1'") and the browser game renders
      # without unit art.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium is used by the project (see playwright.config.ts).
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (traces & screenshots)
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 30
