# Default-deny, then allow only the flows this game needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civ1-default-deny
  namespace: civ1
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civ1-web-ingress
  namespace: civ1
spec:
  podSelector:
    matchLabels: { app: civ1-web }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system } # Traefik
      ports: [{ port: 80, protocol: TCP }]
    - ports: [{ port: 80, protocol: TCP }] # from the node / host port
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civ1-web-egress
  namespace: civ1
spec:
  podSelector:
    matchLabels: { app: civ1-web }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system } # DNS
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - podSelector: { matchLabels: { app: civ1-server } }
      ports: [{ port: 8787, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civ1-server-ingress
  namespace: civ1
spec:
  podSelector:
    matchLabels: { app: civ1-server }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system } # Traefik
      ports: [{ port: 8787, protocol: TCP }, { port: 8788, protocol: TCP }]
    - ports: [{ port: 8787, protocol: TCP }, { port: 8788, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civ1-server-egress
  namespace: civ1
spec:
  podSelector:
    matchLabels: { app: civ1-server }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - podSelector: { matchLabels: { app: civ1-postgres } }
      ports: [{ port: 5432, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civ1-postgres-ingress
  namespace: civ1
spec:
  podSelector:
    matchLabels: { app: civ1-postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: civ1-server } }
      ports: [{ port: 5432, protocol: TCP }]
