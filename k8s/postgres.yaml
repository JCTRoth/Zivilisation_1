apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: civ1-postgres
  namespace: civ1
spec:
  serviceName: civ1-postgres
  replicas: 1
  selector:
    matchLabels: { app: civ1-postgres }
  template:
    metadata:
      labels: { app: civ1-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: civ1-db, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: civ1-db, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: civ1-db, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - { containerPort: 5432 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U civ1 -d civ1"]
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: civ1-postgres
  namespace: civ1
spec:
  clusterIP: None
  selector: { app: civ1-postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: civ1-backups
  namespace: civ1
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: civ1-pg-backup
  namespace: civ1
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: civ1-db, key: POSTGRES_PASSWORD } }
              command:
                - sh
                - -c
                - pg_dump -h civ1-postgres -U civ1 -d civ1 -Fc -f /backups/civ1-$(date +%Y%m%d%H%M).dump
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: civ1-backups }
