apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: civ1
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civ1
  namespace: civ1
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: civ1-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [civ1.local]
      secretName: civ1-tls
  rules:
    - host: civ1.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: civ1-server
                port: { number: 8787 }
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: civ1-server
                port: { number: 8788 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: civ1-web
                port: { number: 80 }
